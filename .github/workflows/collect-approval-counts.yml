name: Collect Hubei 2021-2025 approval counts

on:
  push:
    paths:
      - ".github/workflows/collect-approval-counts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-offcn.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-offcn.txt
      - name: Collect and match public historical data
        run: python scripts/collect_approval_counts_2021_2025.py --delay 0.45
      - name: Commit collection outputs
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/approval_counts_2021_2025/
          if ! git diff --cached --quiet; then
            git commit -m "Collect Hubei historical approval-count comparisons"
            git push
          fi
      - name: Upload outputs even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubei-approval-counts-2021-2025
          path: data/approval_counts_2021_2025/
          if-no-files-found: warn
          retention-days: 14