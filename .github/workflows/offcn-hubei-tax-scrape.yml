name: 中公湖北税务历史数据抓取

on:
  # 仅在这个工作流文件变更时自动启动一次；数据结果提交不会触发递归运行。
  push:
    paths:
      - ".github/workflows/offcn-hubei-tax-scrape.yml"
      - "scripts/offcn_hubei_tax_scraper.py"
      - "requirements-offcn.txt"
  workflow_dispatch:
    inputs:
      skip_details:
        description: "只抓列表页（速度较快，不跟进详情）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-offcn.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-offcn.txt
      - name: Scrape public pages
        shell: bash
        env:
          SKIP_DETAILS: "${{ inputs.skip_details }}"
        run: |
          if [ "$SKIP_DETAILS" = "true" ]; then
            python scripts/offcn_hubei_tax_scraper.py --out data/offcn_hubei_tax_2021_2025 --skip-details --no-raw-html --delay 1.0
          else
            python scripts/offcn_hubei_tax_scraper.py --out data/offcn_hubei_tax_2021_2025 --no-raw-html --delay 1.0
          fi
      - name: Commit generated CSV and audit outputs
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offcn_hubei_tax_2021_2025/*.csv data/offcn_hubei_tax_2021_2025/qa_report.json data/offcn_hubei_tax_2021_2025/scrape_log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update scraped Hubei tax position counts"
            git push
          fi
      - name: Upload scrape data and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offcn-hubei-tax-data
          path: data/offcn_hubei_tax_2021_2025/
          if-no-files-found: warn
          retention-days: 14
