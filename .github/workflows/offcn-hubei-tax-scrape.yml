name: 中公湖北税务历史数据抓取

on:
  push:
    paths:
      - ".github/workflows/offcn-hubei-tax-scrape.yml"
      - "scripts/offcn_hubei_tax_scraper.py"
      - "requirements-offcn.txt"
      - "data/run-full-scrape.txt"
  workflow_dispatch:
    inputs:
      scope:
        description: "抓取范围"
        required: true
        default: "full"
        type: choice
        options:
          - "full"
          - "2025_probe"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-offcn.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-offcn.txt
      - name: Select scrape scope
        shell: bash
        env:
          EVENT_NAME: "${{ github.event_name }}"
          INPUT_SCOPE: "${{ inputs.scope }}"
        run: |
          SCOPE="$INPUT_SCOPE"
          if [ "$EVENT_NAME" = "push" ]; then
            if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx "data/run-full-scrape.txt"; then
              SCOPE="full"
            else
              SCOPE="2025_probe"
            fi
          fi
          if [ "$SCOPE" = "2025_probe" ]; then
            echo "RUN_SCOPE=probe" >> "$GITHUB_ENV"
            echo "OUT_DIR=data/offcn_hubei_tax_probe" >> "$GITHUB_ENV"
          else
            echo "RUN_SCOPE=full" >> "$GITHUB_ENV"
            echo "OUT_DIR=data/offcn_hubei_tax_2021_2025" >> "$GITHUB_ENV"
          fi
          echo "Selected scope: $SCOPE"
      - name: Scrape public pages
        shell: bash
        run: |
          if [ "$RUN_SCOPE" = "probe" ]; then
            python scripts/offcn_hubei_tax_scraper.py --years 2025 --out "$OUT_DIR" --no-raw-html --delay 1.0
          else
            python scripts/offcn_hubei_tax_scraper.py --out "$OUT_DIR" --no-raw-html --delay 1.0
          fi
      - name: Commit generated CSV and audit outputs
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"/*.csv "$OUT_DIR"/*.json "$OUT_DIR"/scrape_log.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update Offcn tax scrape audit outputs"
            git push
          fi
      - name: Upload full scrape artifact
        if: always() && env.RUN_SCOPE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: offcn-hubei-tax-data
          path: data/offcn_hubei_tax_2021_2025/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload 2025 probe artifact
        if: always() && env.RUN_SCOPE == 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: offcn-hubei-tax-2025-probe
          path: data/offcn_hubei_tax_probe/
          if-no-files-found: warn
          retention-days: 14
